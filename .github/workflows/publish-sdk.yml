name: Publish SDK

# Publishes @cleanslice/bridle to npm through npm Trusted Publishing (OIDC):
# no NPM_TOKEN, no 2FA, nothing to rotate. The trusted publisher on npmjs.com
# is bound to this repo and this file name — renaming the file breaks it.
#
# Triggers:
#   - push to main touching sdk/** — publishes only when sdk/package.json
#     carries a version npm does not have yet (a version bump is the release);
#   - tag sdk-v<version> — publishes, the tag must match sdk/package.json;
#   - manual run — publishes with a chosen dist-tag, optionally --dry-run.

on:
  push:
    branches:
      - main
    paths:
      - 'sdk/**'
    tags:
      - 'sdk-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm dist-tag (e.g. latest, next)'
        required: false
        default: 'latest'
      dry_run:
        description: 'Run npm publish with --dry-run'
        type: boolean
        required: false
        default: false

concurrency:
  group: publish-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#sdk-v}"
          echo "package.json version: $PKG_VERSION"
          echo "tag version: $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Decide whether to publish
        id: gate
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing $VERSION (manual or tag trigger)"
          elif npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$PKG@$VERSION is already on npm — bump sdk/package.json to release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$PKG@$VERSION is not on npm yet — publishing."
          fi

      - if: steps.gate.outputs.publish == 'true'
        run: npm ci

      - if: steps.gate.outputs.publish == 'true'
        run: npm run build

      - name: Publish to npm
        if: steps.gate.outputs.publish == 'true'
        run: |
          ARGS="--access public --provenance"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="$ARGS --tag ${{ inputs.tag }}"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              ARGS="$ARGS --dry-run"
            fi
          fi
          npm publish $ARGS
